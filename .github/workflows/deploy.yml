name: Deploy to EC2

# Runs only after CI succeeds on main, so broken builds never deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    # Guard: only deploy when the CI run actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/VibeNet-backend
            git pull origin main
            go build -o vibenet-api ./cmd/api
            sudo systemctl restart vibenet
            sleep 3
            sudo systemctl is-active vibenet

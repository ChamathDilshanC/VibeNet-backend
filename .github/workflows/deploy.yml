name: Deploy to EC2

# Runs only after CI succeeds on main, so broken builds never deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Needed by the release job to create tags + GitHub Releases.
permissions:
  contents: write

jobs:
  deploy:
    name: SSH deploy to EC2
    runs-on: ubuntu-latest
    # Guard: only deploy when the CI run actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Tracks the deploy as a first-class GitHub Environment (Deployments tab).
    environment:
      name: production
      url: https://vibenet-api.duckdns.org
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/VibeNet-backend
            git pull origin main
            go build -o vibenet-api ./cmd/api
            sudo systemctl restart vibenet
            sleep 3
            sudo systemctl is-active vibenet

  release:
    name: Tag & GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: VibeNet Backend v1.0.${{ github.run_number }}
          body: |
            🚀 Auto-released after a successful production deployment to AWS EC2.

            - **Environment:** production
            - **Live endpoint:** https://vibenet-api.duckdns.org
            - **Deployed commit:** ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          make_latest: true
